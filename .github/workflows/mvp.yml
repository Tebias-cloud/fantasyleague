name: FantasyLeague MVP checks

on:
  push:
    branches: [feat/riot-production-mvp-foundation]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/check-mvp.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
